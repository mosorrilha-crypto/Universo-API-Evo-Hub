name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint (tsc --noEmit)
        run: npm run lint

      - name: Test (vitest)
        run: npx vitest run

      - name: Build
        run: npm run build

  # TASK-0202 — restaurado depois de ter sido removido na TASK-0192 (PR
  # #576), que concluiu (corretamente, na época) que o job falhava sempre
  # porque este era um repositório PRIVADO sem licença paga de GitHub
  # Advanced Security (Dependency review é gratuito só em repositório
  # público). O usuário deixou o repositório público de propósito
  # justamente pra ter esse recurso de graça — com isso, o job volta a fazer
  # sentido. Se o repo voltar a ficar privado sem GHAS pago, este job vai
  # voltar a falhar em todo PR — remova de novo nesse cenário.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
