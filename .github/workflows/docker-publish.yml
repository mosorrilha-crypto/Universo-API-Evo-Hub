name: Build & publish Docker image

# Só builda/publica depois que o workflow "CI" (lint/test/build/dependency
# review) passar de verdade no mesmo commit de `main` — nunca publica uma
# imagem sem essa validação, e nunca duplica lint/test aqui. `workflow_run`
# (não `push`) é o jeito certo de expressar essa dependência entre dois
# workflows do GitHub Actions.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    # Achado real do CodeQL (não ignorado): `workflow_run` roda com o
    # GITHUB_TOKEN do REPOSITÓRIO (packages: write incluso), diferente de
    # `pull_request` de um fork (que roda sandboxed, sem esse token). O CI
    # que este workflow observa dispara tanto em `push` quanto em
    # `pull_request` pra `main` — sem este guard, o head_sha de uma PR
    # externa não confiável (repositório é público, qualquer um pode abrir
    # uma) seria checked out e buildado com um token com permissão de
    # escrita no pacote. `event == 'push'` restringe pra só rodar quando o
    # CI observado foi disparado por um push DIRETO em `main` (exige
    # permissão de escrita no repo) — nunca por uma pull_request de fora.
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # GHCR (como qualquer registro Docker) exige nome de imagem em
      # minúsculas — `github.repository` preserva a caixa original
      # ("mosorrilha-crypto/Universo-API-Evo-Hub"), o que quebraria o push
      # sem essa conversão.
      - name: Nome da imagem em minúsculas
        id: image
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # Achado real (primeira execução de verdade, TASK-0390 já mesclada):
      # "Cache export is not supported for the docker driver" — o builder
      # padrão dos runners do GitHub usa o driver "docker", que não sabe
      # exportar cache (cache-to: type=gha abaixo). setup-buildx-action cria
      # um builder com o driver "docker-container", que suporta.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.name }}:latest
            ghcr.io/${{ steps.image.outputs.name }}:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
